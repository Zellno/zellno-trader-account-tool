[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zellno-trader-account-tool"
version = "0.8.0"
description = "Economic auditing and transactional FTP deployment for TraderPlus accounts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Noob Open Source"}]
dependencies = []

[project.scripts]
zellno-trader = "zellno_trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
